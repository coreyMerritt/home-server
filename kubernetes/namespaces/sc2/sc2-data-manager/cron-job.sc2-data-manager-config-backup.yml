apiVersion: batch/v1
kind: CronJob
metadata:
  name: sc2-data-manager-config-backup
  namespace: sc2
spec:
  schedule: "0 5 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          containers:
            - name: backup
              image: ghcr.io/coreymerritt/rsync:1.0.0
              env:
                - name: TZ
                  value: "America/New_York"
              volumeMounts:
                - name: source
                  mountPath: /source
                  readOnly: true
                - name: destination
                  mountPath: /destination
                - name: backup
                  mountPath: /backup
          imagePullSecrets:
            - name: ghcr
          restartPolicy: OnFailure
          volumes:
            - name: source
              persistentVolumeClaim:
                claimName: sc2-data-manager-config
            - name: destination
              nfs:
                server: nfs-server.lan
                path: /misc/prod-data-backups/sc2-data-manager/config
            - name: backup
              nfs:
                server: nfs-server.lan
                path: /misc/prod-data-backups/sc2-data-manager/config.deleted

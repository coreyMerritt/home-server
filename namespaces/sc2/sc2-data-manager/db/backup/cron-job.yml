apiVersion: batch/v1
kind: CronJob
metadata:
  name: sc2-data-manager-db-backup
  namespace: sc2
spec:
  schedule: "0 6 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app
                        operator: In
                        values:
                          - sc2-data-manager
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: backup
              image: ghcr.io/coreymerritt/rsync:1.0.0
              env:
                - name: TZ
                  value: "America/New_York"
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
              volumeMounts:
                - name: source
                  mountPath: /source
                  readOnly: true
                - name: destination
                  mountPath: /destination
                - name: backup
                  mountPath: /backup
          imagePullSecrets:
            - name: ghcr
          restartPolicy: OnFailure
          volumes:
            - name: source
              persistentVolumeClaim:
                claimName: sc2-data-manager-db
            - name: destination
              nfs:
                server: nfs-server.lan
                path: /misc/prod-data/backups/sc2-data-manager/db
            - name: backup
              nfs:
                server: nfs-server.lan
                path: /misc/prod-data/backups/sc2-data-manager/db.deleted

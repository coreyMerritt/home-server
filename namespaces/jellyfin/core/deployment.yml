apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: install-ytdlp
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /tools/yt-dlp
              chmod +x /tools/yt-dlp
              ln -s /tools/yt-dlp /tools/youtube-dl
          volumeMounts:
            - name: tools
              mountPath: /tools
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:latest
          env:
            - name: JELLYFIN_BIND_ADDR
              value: "0.0.0.0"
            - name: JELLYFIN_DATA_DIR
              value: "/config"
            - name: JELLYFIN_CACHE_DIR
              value: "/cache"
            - name: JELLYFIN_CONFIG_DIR
              value: "/config/config"
            - name: JELLYFIN_LOG_DIR
              value: "/config/log"
            - name: JELLYFIN_WEB_DIR
              value: "/jellyfin/jellyfin-web"
            - name: JELLYFIN_FFMPEG
              value: "/usr/lib/jellyfin-ffmpeg/ffmpeg"
            - name: XDG_CACHE_HOME
              value: "/cache"
            - name: PATH
              value: "/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          livenessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 3
          ports:
            - containerPort: 8096
              name: http
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /media
            - name: tools
              mountPath: /tools
      volumes:
        - name: media
          nfs:
            server: nfs-server.lan
            path: /media
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: cache
          emptyDir:
            sizeLimit: 10Gi
        - name: tools
          emptyDir: {}

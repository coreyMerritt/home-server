apiVersion: batch/v1
kind: Job
metadata:
  name: jellyfin-config-restore
  namespace: jellyfin
spec:
  backoffLimit: 2
  template:
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - jellyfin
              topologyKey: kubernetes.io/hostname
      containers:
        - name: restore
          image: ghcr.io/coreymerritt/rsync:1.0.0
          env:
            - name: TZ
              value: "America/New_York"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: destination
              mountPath: /destination
            - name: backup
              mountPath: /backup
      imagePullSecrets:
        - name: ghcr
      restartPolicy: OnFailure
      volumes:
        - name: source
          nfs:
            server: nfs-server.lan
            path: /misc/prod-data/backups/jellyfin/config
        - name: destination
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: backup
          nfs:
            server: nfs-server.lan
            path: /misc/prod-data/backups/jellyfin/config.deleted-during-restore
